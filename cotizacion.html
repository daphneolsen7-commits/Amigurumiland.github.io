<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Amigurumiland | Cotización</title>
    <link rel="icon" type="image/png" href="assets/Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="nav">
        <a class="brand" href="index.html"><img src="assets/Logo.png" alt=""><span>Amigurumiland</span> ♡</a>
        <button class="icon-btn menu-btn" type="button" aria-label="Abrir menú" aria-expanded="false"
            aria-controls="site-nav" onclick="toggleNav()">☰</button>
        <nav class="site-nav" id="site-nav" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="pedido.html">Consultar pedido</a>
            <a href="faq.html">FAQ</a>
            <a href="contacto.html">Contacto</a>
        </nav>
        <a class="icon-btn cart-link" href="carrito.html" aria-label="Abrir carrito"><span
                aria-hidden="true">🛒</span><span class="cart-count" id="cartCount">0</span></a>
    </header>
    <div id="statusMessage" class="toast" role="status" aria-live="polite"></div>
    <main class="container">
        <section class="section page-heading">
            <p class="eyebrow">PERSONALIZACIÓN</p>
            <h1>Cotiza tu amigurumi</h1>
        </section>
        <section class="form-card">
            <form onsubmit="event.preventDefault();submitQuote()"><label>Nombre<input class="field" id="quoteName"
                        required placeholder="Tu nombre"></label><label>Correo<input class="field" id="quoteEmail"
                        type="email" required placeholder="correo@ejemplo.com"></label><label>¿Qué amigurumi tienes en
                    mente?<textarea class="field" id="quoteDesign" required rows="4"
                        placeholder="Personaje, animal o temática"></textarea></label>
                <div class="two-fields"><label>Tamaño<select class="field" id="quoteSize" required>
                            <option value="">Elige un tamaño</option>
                            <option>Pequeño (15 cm)</option>
                            <option>Mediano (20 cm)</option>
                            <option>Grande (30 cm)</option>
                        </select></label><label>Colores<input class="field" id="quoteColors" required
                            placeholder="Ej. crema y verde"></label></div><label>Detalles adicionales<textarea
                        class="field" id="quoteDetails" rows="4" placeholder="Detalles importantes"></textarea></label>
                <p id="quoteFeedback" class="form-error" role="status"></p><button class="btn dark" type="submit">Enviar
                    solicitud de prueba</button>
            </form>
        </section>
    </main>
    <footer>
        <div class="footer">
            <div>
                <h3>♡ Amigurumiland</h3>
                <p>Muñecos tejidos a mano y personalizables.</p>
            </div>
            <div><b>Enlaces</b><a href="index.html">Inicio</a><a href="productos.html">Productos</a><a
                    href="pedido.html">Consultar pedido</a><a href="faq.html">FAQ</a></div>
            <div><b>Contacto</b>
                <p><a id="waLinkFooter" target="_blank" rel="noopener">WhatsApp</a></p>
                <p>daphneolsen7@gmail.com</p>
            </div>
            <div><b>Proyecto</b>
                <p>Prototipo académico HCI.</p>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
